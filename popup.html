<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font: 14px Arial, sans-serif; width: 270px; margin: 0; padding: 16px; color: #172033; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 11px; background: #2563eb; color: white; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin-top: 12px; line-height: 1.4; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <button id="download">Скачать CSV</button>
  <div id="status" role="status" aria-live="polite">Откройте страницу с таблицей заказов.</div>
  <script src="popup.js"></script>
</body>
</html>
